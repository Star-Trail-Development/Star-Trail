name: Release Update

on:
  push:
    branches: [release]
    paths:
      - 'mods/*.pw.toml'
      - 'resourcepacks/*.pw.toml'
      - 'shaderpacks/*.pw.toml'
      - 'pack.toml'
      - 'index.toml'
      - '.github/workflows/release-update.yml'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # commit & push
      pages: write          # deploy pages
      id-token: write       # OIDC for pages deployment

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix packwiz metadata files
        run: |
          chmod +x ./fix-metadata.sh
          ./fix-metadata.sh

      - name: Run packwiz refresh
        run: |
          chmod +x ./packwiz
          ./packwiz refresh

      - name: Check and commit changes
        id: pack_update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add pack.toml index.toml
          git add mods/*.pw.toml resourcepacks/*.pw.toml
          git add shaderpacks/*.pw.toml 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No changes to metadata files"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "update: packwiz refresh"
            git push origin release
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to GitHub Pages
        if: steps.pack_update.outputs.changed == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          force_orphan: true
          exclude_assets: '.github/**, */.gitignore, .packwizignore, fix-metadata.sh, LICENSE, packwiz, README.md'
