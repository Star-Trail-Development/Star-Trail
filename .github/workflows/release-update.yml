name: Release Update

on:
  push:
    branches: [release]
    paths:
      - 'mods/*.pw.toml'
      - 'resourcepacks/*.pw.toml'
      - 'shaderpacks/*.pw.toml'
      - 'pack.toml'
      - 'index.toml'
      - '.github/workflows/release-update.yml'
  workflow_dispatch:
  repository_dispatch:
    types: [release-synced]

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix, refresh, commit & prepare artifact
        id: pack_update
        run: |
          set -euo pipefail

          # 1. 修复元数据 + 刷新 packwiz
          bash ./fix-metadata.sh
          chmod +x ./packwiz && ./packwiz refresh

          # 2. 提交变更到 release 分支
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add pack.toml index.toml \
            mods/*.pw.toml resourcepacks/*.pw.toml \
            shaderpacks/*.pw.toml 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes, skipping commit & deploy"
            exit 0
          fi

          git commit -m "update: packwiz refresh"
          git push origin release
          echo "changed=true" >> "$GITHUB_OUTPUT"

          # 3. 准备 Pages 产物（仅元数据文件）
          mkdir -p _pages/{mods,resourcepacks,shaderpacks}
          cp pack.toml index.toml icon.png _pages/ 2>/dev/null || true
          for dir in mods resourcepacks shaderpacks; do
            cp "$dir"/*.pw.toml "_pages/$dir/" 2>/dev/null || true
          done

      - if: steps.pack_update.outputs.changed == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_pages
          publish_branch: gh-pages
          force_orphan: true
