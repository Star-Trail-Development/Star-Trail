name: Sync download → release

on:
  push:
    branches:
      - download
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: release
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge and transform
        run: |
          set -eo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin download

          # Step 1: 合并 download 到 release
          # -X theirs 处理内容冲突，但 rename/delete 冲突需手动解决
          git merge origin/download -X theirs --no-edit || {
            echo "Merge had conflicts, resolving..."
            # 解决 rename/delete 冲突：HEAD 重命名了文件，但 download 删除了它
            # 统一接受 download 的删除操作
            git diff --name-only --diff-filter=U | while read f; do
              git rm -f "$f" 2>/dev/null || true
            done
            git commit --no-edit
          }

          # Step 2: 路径变换 — mods/.index/*.toml → mods/*.toml
          #           resourcepacks/.index/*.toml → resourcepacks/*.toml
          for dir in mods resourcepacks; do
            if [ -d "$dir/.index" ]; then
              # 先清掉 release 上旧的扁平文件（download 已删除的也会被清掉）
              rm -f "$dir"/*.toml
              git rm -f --cached "$dir"/*.toml 2>/dev/null || true

              # 把 .index/ 下的所有 .toml 移到上级目录
              for f in "$dir/.index"/*.toml; do
                [ -f "$f" ] || continue
                mv "$f" "$dir/"
              done

              # 移除 .index/ 目录
              rm -rf "$dir/.index"
              git rm -r --cached "$dir/.index" 2>/dev/null || true

              # 暂存变换后的扁平文件
              git add "$dir"/*.toml 2>/dev/null || true
            fi
          done

          # shaderpacks 目录结构一致，merge 已处理，无需额外变换

          # Step 3: 提交变更并推送
          git add -u
          if git diff --cached --quiet && git diff --quiet; then
            echo "Nothing changed"
          else
            git add -A
            git commit -m "sync: download → release ($(git rev-parse --short origin/download))"
            git push origin release
          fi
