name: Sync [download] to [release]

on:
  push:
    branches: [download]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0

      - name: Sync and fix changed files from download
        run: |
          set -euo pipefail

          git fetch origin download:download

          # ── 确定 diff 范围 ──
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # 手动触发：直接比较两个分支的 HEAD
            LHS="release"
            RHS="download"
          else
            LHS="${{ github.event.before }}"
            RHS="${{ github.event.after }}"
            # 首次 push（before 为全零 commit）
            if [ "$LHS" = "0000000000000000000000000000000000000000" ]; then
              LHS="4b825dc642cb6eb9a060e54bf899d9b4b8c1c8cc"
            fi
          fi

          echo "Diff range: $LHS .. $RHS"

          # ── 1. 处理新增/修改的文件 ──
          ADDED_MODIFIED=$(git diff --name-only --diff-filter=AM "$LHS" "$RHS" -- \
            mods/.index/ resourcepacks/.index/ shaderpacks/ 2>/dev/null || true)

          if [ -n "$ADDED_MODIFIED" ]; then
            echo "=== Added/Modified ==="
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              case "$file" in
                mods/.index/*)
                  name=$(basename "$file")
                  echo "  + mods/$name"
                  git checkout download -- "$file"
                  mv "$file" "mods/$name"
                  ;;
                resourcepacks/.index/*)
                  name=$(basename "$file")
                  echo "  + resourcepacks/$name"
                  git checkout download -- "$file"
                  mv "$file" "resourcepacks/$name"
                  ;;
                shaderpacks/*)
                  echo "  + $file"
                  git checkout download -- "$file"
                  ;;
              esac
            done <<< "$ADDED_MODIFIED"
          fi

          # ── 2. 处理删除的文件 ──
          DELETED=$(git diff --name-only --diff-filter=D "$LHS" "$RHS" -- \
            mods/.index/ resourcepacks/.index/ shaderpacks/ 2>/dev/null || true)

          if [ -n "$DELETED" ]; then
            echo "=== Deleted ==="
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              case "$file" in
                mods/.index/*)
                  name=$(basename "$file")
                  echo "  - mods/$name"
                  rm -f "mods/$name"
                  ;;
                resourcepacks/.index/*)
                  name=$(basename "$file")
                  echo "  - resourcepacks/$name"
                  rm -f "resourcepacks/$name"
                  ;;
                shaderpacks/*)
                  echo "  - $file"
                  rm -f "$file"
                  ;;
              esac
            done <<< "$DELETED"
          fi

          # 清理可能残留的空 .index/ 目录
          rm -rf mods/.index/ resourcepacks/.index/

          # ── 汇总 ──
          ADDED_COUNT=$(echo "$ADDED_MODIFIED" | grep -c . 2>/dev/null || echo 0)
          DELETED_COUNT=$(echo "$DELETED" | grep -c . 2>/dev/null || echo 0)
          echo "Summary: ${ADDED_COUNT:-0} added/modified, ${DELETED_COUNT:-0} deleted"

      - name: Apply metadata fixes
        run: bash ./fix-metadata.sh

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "sync: merge download to release"
            git merge origin/download -s ours
            git push origin release
          fi
          
      - name: Trigger release-update workflow
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/dispatches" \
            -d '{"event_type":"release-synced"}'
