name: Sync download → release

on:
  push:
    branches:
      - download
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: release
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync modules
        run: |
          set -eo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin download

          # 将 download 上的 .toml 文件映射到 release 相应位置
          # 映射规则: download 任意位置的 x.toml → release 对应目录下的 x.toml
          for dir in mods resourcepacks; do
            # 先删除 release 上对应的旧文件（download 已移除的）
            # 用递归 -r 同时查看 flat 和 .index/ 下的文件
            for f in "$dir"/*.toml; do
              [ -f "$f" ] || continue
              name=$(basename "$f")
              if ! git ls-tree --name-only -r origin/download "$dir/" | grep -qxF "$name"; then
                echo "  删除: $f (download 已移除)"
                rm -f "$f"
                git rm -f --cached "$f" 2>/dev/null || true
              fi
            done

            # 从 download 写入所有 .toml 文件
            DL_FILES=$(git ls-tree --name-only -r origin/download "$dir/" | grep '\.toml$' || true)
            if [[ -n "$DL_FILES" ]]; then
              while IFS= read -r src; do
                [[ -z "$src" ]] && continue
                dest="$dir/$(basename "$src")"
                mkdir -p "$dir"
                if [[ ! -f "$dest" ]] || ! diff -q <(git show "origin/download:$src") "$dest" >/dev/null 2>&1; then
                  git show "origin/download:$src" > "$dest"
                  echo "  写入: $dest"
                fi
              done <<< "$DL_FILES"
            fi
          done

          # shaderpacks 直接同步
          SHADER_FILES=$(git ls-tree --name-only -r origin/download shaderpacks/ 2>/dev/null || true)
          if [[ -n "$SHADER_FILES" ]]; then
            while IFS= read -r src; do
              [[ -z "$src" ]] && continue
              mkdir -p "$(dirname "$src")"
              if [[ ! -f "$src" ]] || ! diff -q <(git show "origin/download:$src") "$src" >/dev/null 2>&1; then
                git show "origin/download:$src" > "$src"
                echo "  写入: $src"
              fi
            done <<< "$SHADER_FILES"
          fi

          # 暂存
          git add -f mods/ resourcepacks/ shaderpacks/ 2>/dev/null || true
          git add -u

          if git diff --cached --quiet; then
            echo "Nothing changed"
          else
            git commit -m "sync: download → release ($(git rev-parse --short origin/download))"
            git push origin release
          fi
