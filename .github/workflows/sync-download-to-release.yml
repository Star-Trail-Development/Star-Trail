name: Sync download → release

on:
  push:
    branches:
      - download
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: release
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge and transform
        run: |
          set -eo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin download

          # Step 1: 合并 download 到 release
          git merge origin/download -X theirs --no-edit || {
            echo "Merge had conflicts, resolving..."
            # 冲突类型（git status --porcelain 前两列）：
            #   DU = Deleted by us, Updated by them   → 保留 download 版本
            #   UA = Added by them, dir renamed by us  → git 已自动放到正确位置
            #   UD = Renamed by us, Deleted by them    → 接受删除
            git status --porcelain | while read xy file; do
              case "$xy" in
                DU)
                  git checkout --theirs "$file" 2>/dev/null || true
                  git add "$file"
                  ;;
                UA)
                  git add "$file"
                  ;;
                UD)
                  git rm -f "$file" 2>/dev/null || true
                  ;;
                AU|AA|UU|DD)
                  git checkout --theirs "$file" 2>/dev/null || true
                  git add "$file" 2>/dev/null || git rm -f "$file" 2>/dev/null || true
                  ;;
              esac
            done
            git commit --no-edit
          }

          # 清理可能残留的 .index/ 空目录
          for dir in mods resourcepacks; do
            if [ -d "$dir/.index" ]; then
              rm -rf "$dir/.index"
              git rm -r --cached "$dir/.index" 2>/dev/null || true
            fi
          done

          # Step 2: 路径变换 — mods/.index/*.toml → mods/*.toml
          #           resourcepacks/.index/*.toml → resourcepacks/*.toml
          for dir in mods resourcepacks; do
            if [ -d "$dir/.index" ]; then
              rm -f "$dir"/*.toml
              git rm -f --cached "$dir"/*.toml 2>/dev/null || true
              for f in "$dir/.index"/*.toml; do
                [ -f "$f" ] || continue
                mv "$f" "$dir/"
              done
              rm -rf "$dir/.index"
              git rm -r --cached "$dir/.index" 2>/dev/null || true
              git add "$dir"/*.toml 2>/dev/null || true
            fi
          done

          # shaderpacks 目录结构一致，merge 已处理

          # Step 3: 提交变更并推送
          git add -u
          if git diff --cached --quiet && git diff --quiet; then
            echo "Nothing changed"
          else
            git add -A
            git commit -m "sync: download → release ($(git rev-parse --short origin/download))"
            git push origin release
          fi
