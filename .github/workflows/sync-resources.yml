name: Sync Resources to Download Repo

on:
  push:
    branches: [download]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # 源：download 分支
      - name: Checkout download branch (source)
        uses: actions/checkout@v4
        with:
          ref: download

      # 目标：resources-download（用 PAT 克隆，空仓库也能正常 clone）
      - name: Clone resources-download (target)
        env:
          PAT: ${{ secrets.PAT_MODRINTH_DOWNLOAD }}
        run: |
          git clone "https://x-access-token:${PAT}@github.com/Star-Trail-Development/resources-download.git" download-repo

      - name: Sync resource metadata files
        run: |
          set -euo pipefail

          # 只重建三个内容目录；保留 .github/、pack.toml、index.toml、fix-metadata.sh、packwiz 等
          # 这些文件由部署工作流（download-and-deploy-resources.yaml）依赖，不能被清空
          cd download-repo
          rm -rf mods resourcepacks shaderpacks
          mkdir -p mods resourcepacks shaderpacks
          cd ..

          # 收集 download 分支上的全部元数据，按目录展平到目标仓库
          # 资源可能来自 Modrinth 或 CurseForge，因此不再按 [update.modrinth] 段筛选
          count=0
          while IFS= read -r -d '' file; do
            case "$file" in
              mods/*)
                target="download-repo/mods/$(basename "$file")"
                ;;
              resourcepacks/*)
                target="download-repo/resourcepacks/$(basename "$file")"
                ;;
              shaderpacks/*)
                target="download-repo/$file"
                ;;
              *)
                continue
                ;;
            esac
            cp "$file" "$target"
            echo "  + $target"
            count=$((count + 1))
          done < <(find mods/.index resourcepacks/.index shaderpacks -type f -name '*.pw.toml' -print0 2>/dev/null || true)

          echo "Synced $count file(s)"

      - name: Commit and push to main
        run: |
          set -euo pipefail
          cd download-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "sync: resources from Star-Trail [download] branch"
          git push origin main
